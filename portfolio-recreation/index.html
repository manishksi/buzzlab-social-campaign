/* ============================================================
   Loader
   ============================================================ */
.loading-screen {
  position: fixed;
  width: 100vw;
  height: var(--vh);
  background-color: #eae5ec;
  z-index: 999999999;
  display: flex;
  place-items: center;
  justify-content: center;
  top: 0;
  left: 0;
}
.loading-button {
  padding: 20px 50px;
  border-radius: 100px;
  background-color: #000;
  overflow: hidden;
  font-size: 18px;
  font-weight: 500;
  position: relative;
  z-index: 9;
}
.loading-button::before {
  content: "";
  background-color: #fff;
  top: var(--mouse-y);
  left: var(--mouse-x);
  border-radius: 50%;
  width: 60px;
  height: 60px;
  position: absolute;
  z-index: 99;
  filter: blur(60px);
  opacity: 0;
  transform: translate(-50%, -50%);
}
.loading-button:hover::before { opacity: 1; }
.loading-clicked .loading-button::before { opacity: 0; }
.loading-wrap {
  --Lsize: 145px;
  padding: 6px;
  position: relative;
  min-width: 0px;
  min-height: 0px;
  border-radius: 100px;
  background-color: #000;
  overflow: hidden;
  transition: 0.8s ease-in-out;
  transition-delay: 0.2s;
  box-shadow: 0 15px 15px #0003;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #eae5ec;
}
.loading-clicked {
  transition-delay: 0ms;
  transition-timing-function: cubic-bezier(0.33, 0.11, 1, 0.72);
  transform: scale(1);
  min-width: calc(100vw + 5000px);
  border-radius: 5000px;
  min-height: calc(100vh + 500px);
  box-shadow: none;
}
.loading-clicked .loading-button { overflow: visible; }
.loading-hover {
  background-color: #a87cff;
  width: 250px;
  height: 120px;
  position: absolute;
  top: var(--mouse-y);
  left: var(--mouse-x);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  filter: blur(30px);
  opacity: 1;
  transition: opacity 0.5s;
}
.loading-clicked .loading-hover { opacity: 0; }
.loading-content {
  position: relative;
  background-color: #000;
  width: 100%;
  overflow: hidden;
  transition: 0.6s;
  text-transform: uppercase;
}
.loading-content-in { position: relative; width: var(--Lsize); overflow: hidden; white-space: nowrap; }
.loading-content2 {
  position: relative;
  letter-spacing: 2px;
  text-transform: uppercase;
  width: var(--Lsize);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  column-gap: 10px;
  text-align: center;
  transition: 1s;
  max-width: var(--Lsize);
}
.loading-clicked .loading-content2 { opacity: 0; transition: 0.5s; overflow: visible; }
.loading-content span {
  font-weight: 300;
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  opacity: 0.7;
}
.loading-box {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translate(100%, -50%);
  width: 15px;
  height: 25px;
  background-color: #fff;
  animation: blink 1s linear infinite;
}
.loading-clicked .loading-content2 span { transition: 1s; transform: translateY(100px); opacity: 0; }
.loading-container {
  position: absolute;
  width: 100%;
  max-width: var(--Lsize);
  top: 50%;
  transition: 1s;
  left: 50px;
  z-index: 9;
  transform: translateY(-50%);
}
.loading-complete .loading-container { max-width: 0px; }
.loading-header {
  width: var(--cWidth);
  max-width: var(--cMaxWidth);
  position: fixed;
  z-index: 9999999999;
  display: flex;
  justify-content: space-between;
  box-sizing: border-box;
  padding: 20px 0;
  left: 50%;
  transform: translate(-50%);
  top: 0;
  color: var(--backgroundColor);
}
.loader-title { font-weight: 700; font-size: 14px; letter-spacing: 0.2px; }
.loader-title:hover { color: var(--backgroundColor); }
@keyframes blink { 0% { opacity: 0; } 25% { opacity: 1; } 75% { opacity: 1; } to { opacity: 0; } }
.loading-complete .loading-box { animation: blinkDone 0.3s forwards; animation-delay: 1s; opacity: 1; }
@keyframes blinkDone { to { opacity: 0; } }
.loaderGame-container {
  width: 200px;
  transition: 0.3s;
  height: 100px;
  overflow: hidden;
  position: relative;
  transform: scale(0.4);
  transform-origin: top right;
}
.loader-out .loaderGame-container { opacity: 0; }
.loaderGame-in {
  width: 1200px;
  position: absolute;
  overflow: hidden;
  left: 0;
  animation: loaderGame 7s linear infinite;
}
@keyframes loaderGame { 0% { transform: translate(0); } to { transform: translate(-300px); } }
.loaderGame-line {
  float: left;
  margin: 0 20px 40px;
  position: relative;
  width: 10px;
  height: 60px;
  background-color: #000;
  display: block;
}
.loaderGame-line:nth-child(2n) { margin-top: 40px; margin-bottom: 0; }
.loaderGame-ball {
  position: absolute;
  left: 20%;
  top: 0%;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background-color: #a87cff;
  animation: ball25 7s infinite;
  transform: translateY(10px);
  animation-timing-function: cubic-bezier(0.3, 1.18, 0.63, 1.28);
}
@keyframes ball25 {
  0% { transform: translateY(70px); }
  15% { transform: translateY(10px); }
  30% { transform: translateY(70px); }
  45% { transform: translateY(10px); }
  67% { transform: translateY(70px); }
  80% { transform: translateY(10px); }
  90% { transform: translateY(70px); }
  to { transform: translateY(70px); }
}
.loading-marquee {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  transform: translateY(-50%);
  color: var(--backgroundColor);
  font-size: 60px;
  font-weight: 600;
  text-transform: uppercase;
  line-height: 1.5;
}
.marquee { display: flex; overflow-x: hidden; width: 100%; }
.marquee-track {
  flex: 0 0 auto;
  min-width: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
  animation: marqueeScroll var(--duration, 60s) linear infinite;
}
@keyframes marqueeScroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
.loading-marquee span { padding: 0 50px; position: relative; white-space: pre; }
.loading-marquee span::before {
  content: "";
  width: 20px;
  height: 20px;
  background-color: var(--backgroundColor);
  position: absolute;
  top: 50%;
  border-radius: 50px;
  left: 0;
  transform: translate(-50%, -50%);
}
@media only screen and (min-width: 1400px) {

/* ============================================================

   ============================================================ */
.career-section {

.career-info { position: relative; display: flex; flex-direction: column; margin: 0 auto; }

/* ============================================================
   Cursor
   ============================================================ */
.cursor-main {
  --size: 0px;
  position: fixed;
  top: calc(var(--size) / -2);
  left: calc(var(--size) / -2);
  width: var(--size);
  height: var(--size);
  border-radius: 50px;
  pointer-events: none;
  z-index: 99;
  background-color: #e6c3ff;
  box-shadow: 0 0 30px #af83ff;
  mix-blend-mode: difference;
  transition: top 0.3s ease-out, left 0.3s ease-out, width 0.3s ease-out, height 0.3s ease-out;
}
.cursor-icons { top: 10px; left: 10px; height: calc(var(--cursorH) - 20px); transition: all 0.5s ease-out, height 0.5s ease-in-out; }
.cursor-disable { --size: 0px; }
@media only screen and (min-width: 600px) {
  .cursor-main { --size: 50px; }
  .cursor-disable { --size: 0px; }
}
@media (hover: none) { .cursor-main { display: none; } }

.techstack-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
.techstack-video { width: 100%; height: 100%; display: block; }
.techstack-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #00000080; z-index: 1; }
.techstack-video-container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 150px;
  background: linear-gradient(to bottom, #0b080c 0%, transparent 100%);
  z-index: 2;
  pointer-events: none;
}
.techstack-video-container::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 150px;
  background: linear-gradient(to top, #0b080c 0%, transparent 100%);
  z-index: 2;
  pointer-events: none;
}
.techstack-content { position: relative; z-index: 2; width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 20px; }
.techstack-content h2 {
  font-size: 70px;
  text-align: center;
  font-weight: 400;
  text-transform: uppercase;
  margin-top: 0.83em;
  margin-bottom: 50px;
  background: linear-gradient(180deg, #fff, #c2a4ff);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.techstack-pyramid { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.techstack-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.techstack-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 55px;
  height: 68px;
  padding: 8px;
  border-radius: 10px;
  background: #ffffff08;
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.3s ease;
  text-decoration: none;
  cursor: pointer;
}
.techstack-item:hover {
  transform: translateY(-6px) scale(1.08);
  background: #c2a4ff1a;
  border-color: var(--accentColor);
  box-shadow: 0 8px 30px #c2a4ff40;
}
.techstack-item img {
  width: 30px;
  height: 30px;
  object-fit: contain;
  filter: grayscale(100%) contrast(1.2) brightness(1.5);
  opacity: 0.85;
  transition: filter 0.3s ease, opacity 0.3s ease;
}
.techstack-item:hover img { filter: none; opacity: 1; }
.techstack-item span {
  font-size: 9px;
  color: #ffffffb3;
  margin-top: 5px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50px;
}
.techstack-item:hover span { color: #fff; }
@media screen and (max-width: 1200px) {
  .techstack-content { max-width: 900px; }
  .techstack-item { width: 50px; height: 62px; }
  .techstack-item img { width: 26px; height: 26px; }
  .techstack-item span { font-size: 8px; }
}
@media screen and (max-width: 900px) {
  .techstack-content h2 { font-size: 50px; margin-bottom: 35px; }
  .techstack-pyramid, .techstack-row { gap: 8px; }
  .techstack-item { width: 45px; height: 56px; padding: 6px; }
  .techstack-item img { width: 22px; height: 22px; }
  .techstack-item span { font-size: 7px; max-width: 42px; }

/* ==================================================================
   Project cover art (generated, original SVG illustrations)
   ================================================================== */
function coverSVG(p) {
  const W = 880, H = 490;
  const pal = p.motif === "chess"
    ? { a: "#1b1416", b: "#060405", glow: "#ff3b4f", line: "#ff6b7a" }
    : { a: "#0d4a5c", b: "#04141d", glow: "#3fd4ff", line: "#7fe6ff" };
  const rnd = (() => { let s = [...p.title].reduce((a, c) => a + c.charCodeAt(0), 7); return () => ((s = (s * 9301 + 49297) % 233280) / 233280); })();
  let motif = "";
  const cx = 440, cy = 300;
  if (p.motif === "brain") {
    const pts = [];
    for (let i = 0; i < 46; i++) {
      const t = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
      pts.push([cx + Math.cos(t) * r * 190, cy + Math.sin(t) * r * 115]);
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
      if (d < 70) motif += `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}" stroke="${pal.line}" stroke-opacity="${(0.55 - d / 160).toFixed(2)}" stroke-width="1.4"/>`;
    }
    pts.forEach(([x, y]) => (motif += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2 + rnd() * 3.5).toFixed(1)}" fill="#e9fbff"/>`));
    motif += `<path d="M${cx} ${cy - 120} C ${cx - 10} ${cy - 40}, ${cx + 10} ${cy + 40}, ${cx} ${cy + 118}" stroke="#e9fbff" stroke-opacity=".35" stroke-width="2" fill="none"/>`;
  } else if (p.motif === "chain") {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2, x = cx + Math.cos(a) * 165, y = cy + Math.sin(a) * 95;
      const hex = [...Array(6)].map((_, k) => { const t = (k / 6) * Math.PI * 2 + Math.PI / 6; return `${(x + Math.cos(t) * 34).toFixed(1)},${(y + Math.sin(t) * 34).toFixed(1)}`; }).join(" ");
      motif += `<polygon points="${hex}" fill="${pal.glow}" fill-opacity=".14" stroke="${pal.line}" stroke-width="2.5"/>`;
      const a2 = ((i + 1) / 8) * Math.PI * 2;
      motif += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(cx + Math.cos(a2) * 165).toFixed(1)}" y2="${(cy + Math.sin(a2) * 95).toFixed(1)}" stroke="${pal.line}" stroke-opacity=".5" stroke-width="3" stroke-dasharray="6 6"/>`;
    }
    motif += `<rect x="${cx - 62}" y="${cy - 50}" width="124" height="100" rx="14" fill="#e9fbff" fill-opacity=".12" stroke="#e9fbff" stroke-width="3"/>
      <rect x="${cx - 34}" y="${cy - 62}" width="68" height="14" rx="4" fill="#e9fbff"/>
      <path d="M${cx - 26} ${cy + 2} l18 18 l36 -40" stroke="#e9fbff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (p.motif === "flood") {
    for (let k = 0; k < 6; k++) {
      let d = `M60 ${cy + 40 + k * 18}`;
      for (let x = 60; x <= 820; x += 20) d += ` L${x} ${(cy + 40 + k * 18 + Math.sin(x / 45 + k) * (10 - k)).toFixed(1)}`;
      motif += `<path d="${d}" stroke="${pal.line}" stroke-opacity="${(0.7 - k * 0.1).toFixed(2)}" stroke-width="2" fill="none"/>`;
    }
    [60, 95, 75, 130, 110, 160].forEach((h, i) => (motif += `<rect x="${560 + i * 34}" y="${cy + 10 - h}" width="22" height="${h}" rx="4" fill="${pal.glow}" fill-opacity="${0.35 + i * 0.1}"/>`));
    motif += `<path d="M${cx - 160} ${cy - 30} q 0 -60 40 -110 q 40 50 40 110 a 40 40 0 0 1 -80 0z" fill="#e9fbff" fill-opacity=".85"/>
      <polyline points="120,${cy - 10} 180,${cy - 50} 240,${cy - 30} 300,${cy - 90}" stroke="#e9fbff" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  } else if (p.motif === "voice") {
    for (let k = 1; k <= 5; k++) motif += `<circle cx="${cx}" cy="${cy}" r="${k * 34}" stroke="${pal.line}" stroke-opacity="${(0.65 - k * 0.1).toFixed(2)}" stroke-width="2" fill="none" ${k % 2 ? 'stroke-dasharray="4 8"' : ""}/>`;
    let wave = "";
    for (let i = 0; i < 41; i++) { const x = cx - 200 + i * 10, h = (Math.sin(i * 0.7) * 0.5 + 0.6) * (1 - Math.abs(i - 20) / 22) * 120; wave += `<rect x="${x - 3}" y="${(cy - h / 2).toFixed(1)}" width="6" height="${h.toFixed(1)}" rx="3" fill="#ffb27a" fill-opacity=".9"/>`; }
    motif += wave + `<circle cx="${cx}" cy="${cy}" r="26" fill="#ff7a3d"/><circle cx="${cx}" cy="${cy}" r="12" fill="#fff3e8"/>`;
  } else if (p.motif === "chess") {
    const top = cy - 40, bot = cy + 150;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const y0 = top + (bot - top) * (r / 8), y1 = top + (bot - top) * ((r + 1) / 8);
      const w0 = 180 + r * 40, w1 = 180 + (r + 1) * 40;
      const x00 = cx - w0 + (2 * w0 * c) / 8, x01 = cx - w0 + (2 * w0 * (c + 1)) / 8;
      const x10 = cx - w1 + (2 * w1 * c) / 8, x11 = cx - w1 + (2 * w1 * (c + 1)) / 8;
      motif += `<polygon points="${x00},${y0} ${x01},${y0} ${x11},${y1} ${x10},${y1}" fill="${(r + c) % 2 ? "#2a1d20" : "#d9cfd1"}" fill-opacity="${(r + c) % 2 ? 0.95 : 0.85}"/>`;
    }
    motif += `<g stroke="${pal.line}" stroke-width="2" stroke-opacity=".8">${[...Array(7)].map(() => { const x = 120 + rnd() * 640, y = 150 + rnd() * 250; return `<line x1="${cx}" y1="${cy - 40}" x2="${x.toFixed(0)}" y2="${y.toFixed(0)}"/>`; }).join("")}</g>
      <circle cx="770" cy="150" r="44" fill="#e0263a"/><text x="770" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="24" fill="#fff">3640</text><text x="770" y="172" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="13" fill="#fff">ELO</text>`;
  }
  const chips = (p.chips || []).map((c, i, arr) => {
    const pos = [[130, 200], [750, 200], [130, 410], [750, 410]][i % 4];
    const w = c.length * 9.2 + 28;
    return `<g><rect x="${pos[0] - w / 2}" y="${pos[1] - 15}" width="${w}" height="30" rx="15" fill="#06222c" fill-opacity=".85" stroke="${pal.line}" stroke-opacity=".7"/><text x="${pos[0]}" y="${pos[1] + 5}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="14" fill="#e9fbff">${esc(c)}</text></g>`;
  }).join("");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal.a}"/><stop offset="1" stop-color="${pal.b}"/></linearGradient>
      <radialGradient id="gl" cx=".5" cy=".62" r=".55"><stop offset="0" stop-color="${pal.glow}" stop-opacity=".45"/><stop offset="1" stop-color="${pal.glow}" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
    </defs>
    <rect width="${W}" height="${H}" fill="url(#bg)"/><rect width="${W}" height="${H}" fill="url(#grid)"/><rect width="${W}" height="${H}" fill="url(#gl)"/>
    ${motif}${chips}
    <text x="${W / 2}" y="84" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="56" fill="#fff">${esc(p.title)}</text>
    <text x="${W / 2}" y="116" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="17" fill="#fff" fill-opacity=".85">${esc(p.tagline || "")}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* Lightweight text splitter: inline spans for chars/words, block spans for lines
   (lines are measured on the next frame, once the browser has laid the text out). */
class SplitText {
  constructor(target, opts = {}) {
    const type = opts.type || "chars,words,lines", linesClass = opts.linesClass || "split-line";
    const list = Array.isArray(target) ? target : [target];
    this.chars = []; this.words = []; this.lines = []; this.original = new Map();
    this.elements = list.flatMap((t) => (typeof t === "string" ? $$(t) : t instanceof Element ? [t] : Array.from(t)));
    this.elements.forEach((el) => {
      this.original.set(el, el.innerHTML);
      if (type.includes("chars") && type.includes("words")) { this.splitWords(el); this.splitCharsFromWords(el); }
      else if (type.includes("chars")) this.splitChars(el);
      else if (type.includes("words")) this.splitWords(el);
      if (type.includes("lines")) this.splitLines(el, linesClass);
    });
  }
  splitChars(el) {
    el.innerHTML = (el.textContent || "").split("").map((c) => (c === " " ? '<span class="split-char"> </span>' : c === "\n" ? "<br>" : `<span class="split-char">${esc(c)}</span>`)).join("");
    this.chars.push(...el.querySelectorAll(".split-char"));
  }
  splitWords(el) {
    el.innerHTML = (el.textContent || "").split(/(\s+)/).map((w) => (w.trim().length === 0 ? w : `<span class="split-word">${esc(w)}</span>`)).join("");
    this.words.push(...el.querySelectorAll(".split-word"));
  }
  splitCharsFromWords(el) {
    el.querySelectorAll(".split-word").forEach((w) => {
      w.innerHTML = (w.textContent || "").split("").map((c) => `<span class="split-char">${esc(c)}</span>`).join("");
      this.chars.push(...w.querySelectorAll(".split-char"));
    });
  }
  splitLines(el, cls) {
    requestAnimationFrame(() => {
      const parts = el.querySelectorAll(".split-word, .split-char");
      if (!parts.length) return;
      const groups = [];
      let cur = [], top = 0;
      parts.forEach((p) => {
        const r = p.getBoundingClientRect();
        if (top === 0) top = r.top;
        if (Math.abs(r.top - top) > 5) { if (cur.length) groups.push(cur); cur = [p]; top = r.top; } else cur.push(p);
      });
      if (cur.length) groups.push(cur);
      groups.forEach((g) => {
        const line = document.createElement("span");
        line.className = cls;
        line.style.display = "block";
        g[0].parentNode.insertBefore(line, g[0]);
        g.forEach((p) => { if (p.parentNode === line.parentNode) line.appendChild(p); });
      });
      this.lines.push(...el.querySelectorAll(`.${cls}`));
    });
  }
  revert() { this.elements.forEach((el) => { const h = this.original.get(el); if (h !== undefined) el.innerHTML = h; }); }
}

/* ==================================================================
   Loader marquee speed (50px/s like react-fast-marquee)
   ================================================================== */
function sizeMarquee() {
  const track = $(".marquee-track");
  if (!track) return;
  const d = Math.max(track.getBoundingClientRect().width / 50, 1);
  $$(".marquee-track").forEach((t) => t.style.setProperty("--duration", d + "s"));
}
sizeMarquee();
document.fonts && document.fonts.ready.then(sizeMarquee);

/* ==================================================================
   Custom cursor
   ================================================================== */
(function cursor() {
  const el = $(".cursor-main");
  let hover = false;
  const m = { x: 0, y: 0 }, p = { x: 0, y: 0 };
  document.addEventListener("mousemove", (e) => { m.x = e.clientX; m.y = e.clientY; });
  (function loop() {
    if (!hover) {
      p.x += (m.x - p.x) / 6;
      p.y += (m.y - p.y) / 6;
      gsap.to(el, { x: p.x, y: p.y, duration: 0.1 });
    }
    requestAnimationFrame(loop);
  })();
  $$("[data-cursor]").forEach((n) => {
    n.addEventListener("mouseover", (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      if (n.dataset.cursor === "icons") {
        el.classList.add("cursor-icons");
        gsap.to(el, { x: r.left, y: r.top, duration: 0.1 });
        el.style.setProperty("--cursorH", `${r.height}px`);
        hover = true;
      }
      if (n.dataset.cursor === "disable") el.classList.add("cursor-disable");
    });
    n.addEventListener("mouseout", () => { el.classList.remove("cursor-disable", "cursor-icons"); hover = false; });
  });
})();

/* Magnetic social icons */
$$("#social span").forEach((span) => {
  const a = span.querySelector("a");
  let tx = 25, ty = 25, x = 0, y = 0;
  const loop = () => {
    x += 0.1 * (tx - x); y += 0.1 * (ty - y);
    a.style.setProperty("--siLeft", `${x}px`);
    a.style.setProperty("--siTop", `${y}px`);
    requestAnimationFrame(loop);
  };
  document.addEventListener("mousemove", (e) => {
    const r = span.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    if (dx < 40 && dx > 10 && dy < 40 && dy > 5) { tx = dx; ty = dy; } else { tx = r.width / 2; ty = r.height / 2; }
  });
  loop();
});

/* Loader button glow follows the mouse */
$("#loadingWrap").addEventListener("mousemove", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty("--mouse-x", `${e.clientX - r.left}px`);
  e.currentTarget.style.setProperty("--mouse-y", `${e.clientY - r.top}px`);
});

/* ==================================================================
   What I do — tap to expand on touch devices
   ================================================================== */
if (ScrollTrigger.isTouch) {
  const cards = $$(".what-content");
  cards.forEach((card) => {
    card.classList.remove("what-noTouch");
    card.addEventListener("click", () => {
      card.classList.toggle("what-content-active");
      card.classList.remove("what-sibling");
      cards.forEach((o) => { if (o !== card) { o.classList.remove("what-content-active"); o.classList.toggle("what-sibling"); } });
    });
  });
}

/* ==================================================================
   Loading progress (same pacing as the original)
   ================================================================== */
function createProgress(onChange) {
  let n = 0;
  let timer = setInterval(() => {
    if (n <= 50) { n += Math.round(5 * Math.random()); onChange(n); }
    else {
      clearInterval(timer);
      timer = setInterval(() => { n += Math.round(Math.random()); onChange(n); if (n > 91) clearInterval(timer); }, 2000);
    }
  }, 100);
  return {
    loaded: () => new Promise((res) => {
      clearInterval(timer);
      timer = setInterval(() => { if (n < 100) { n++; onChange(n); } else { res(n); clearInterval(timer); } }, 2);
    }),
  };
}

/* ==================================================================
   Intro text FX (runs as the loader leaves)
   ================================================================== */
function initialFX() {
  document.body.style.overflowY = "auto";
  lenis.start();
  $("main").classList.add("main-active");
  gsap.to("body", { backgroundColor: "#0b080c", duration: 0.5, delay: 1 });
  const fx = { opacity: 1, duration: 1.2, filter: "blur(0px)", ease: "power3.inOut", y: 0, stagger: 0.025, delay: 0.3 };
  const intro = new SplitText([".landing-info h3", ".landing-intro h2", ".landing-intro h1"].flatMap((s) => $$(s)), { type: "chars,lines", linesClass: "split-line" });
  gsap.fromTo(intro.chars, { opacity: 0, y: 80, filter: "blur(5px)" }, fx);
  const h2opts = { type: "chars,lines", linesClass: "split-h2" };
  const info = new SplitText(".landing-h2-info", h2opts);
  gsap.fromTo(info.chars, { opacity: 0, y: 80, filter: "blur(5px)" }, fx);
  gsap.fromTo(".landing-info-h2", { opacity: 0, y: 30 }, { opacity: 1, duration: 1.2, ease: "power1.inOut", y: 0, delay: 0.8 });
  gsap.fromTo([".header", ".icons-section", ".nav-fade"], { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.inOut", delay: 0.1 });
  new SplitText(".landing-h2-1", h2opts);
}

function finishLoader() {
  const btn = $("#loadingButton"), wrap = $("#loadingWrap");
  setTimeout(() => {
    btn.classList.add("loading-complete");
    setTimeout(() => {
      wrap.classList.add("loading-clicked");
      $(".loaderGame").classList.add("loader-out");
      setTimeout(() => {
        initialFX();
        $("#loader").remove();
      }, 900);
    }, 1000);
  }, 600);
}

/* ==================================================================
   Section scroll animations
   ================================================================== */
function setupSectionAnimations() {
  const mm = gsap.matchMedia();

  // Paragraph / title reveal (>= 900px)
  mm.add("(min-width: 900px)", () => {
    const start = window.innerWidth <= 1024 ? "top 60%" : "20% 60%";
    const toggle = "play pause resume reverse";
    const splits = [];
    $$(".para").forEach((el) => {
      const s = new SplitText(el, { type: "lines,words", linesClass: "split-line" });
      splits.push(s);
      gsap.fromTo(s.words, { autoAlpha: 0, y: 80 }, {
        autoAlpha: 1, y: 0, duration: 1, ease: "power3.out", stagger: 0.02,
        scrollTrigger: { trigger: el.parentElement.parentElement, toggleActions: toggle, start },
      });
    });
    $$(".title").forEach((el) => {
      const s = new SplitText(el, { type: "chars,lines", linesClass: "split-line" });
      splits.push(s);
      gsap.fromTo(s.chars, { autoAlpha: 0, y: 80, rotate: 10 }, {
        autoAlpha: 1, y: 0, rotate: 0, duration: 0.8, ease: "power2.inOut", stagger: 0.03,
        scrollTrigger: { trigger: el.parentElement.parentElement, toggleActions: toggle, start },
      });
    });
    return () => splits.forEach((s) => s.revert());
  });

  // Career timeline
  mm.add({ desktop: "(min-width: 1025px)", small: "(max-width: 1024px)" }, (ctx) => {
    const tl = gsap.timeline({
      scrollTrigger: { trigger: ".career-section", start: "top 50%", end: "bottom 30%", scrub: 1.5, invalidateOnRefresh: true },
    });
    tl.fromTo(".career-timeline", { maxHeight: "0%" }, { maxHeight: "100%", duration: 1, ease: "none" }, 0)
      .fromTo(".career-timeline", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0)
      .fromTo(".career-info-box", { opacity: 0 }, { opacity: 1, stagger: 0.1, duration: 0.5 }, 0)
      .fromTo(".career-dot", { animationIterationCount: "infinite" }, { animationIterationCount: "1", delay: 0.3, duration: 0.1 }, 0)
      .fromTo(".career-section", { y: 0 }, { y: ctx.conditions.desktop ? "20%" : 0, duration: 0.5, delay: 0.2 }, 0);
  });

  // "What I do" cards appear when reached (tablet/mobile); desktop is driven by the 3D timeline
  mm.add("(max-width: 1024px)", () => {
    gsap.timeline({ scrollTrigger: { trigger: ".what-box-in", start: "top 70%", end: "bottom top" } })
      .fromTo(".what-box-in", { display: "none" }, { display: "flex", duration: 0.1, delay: 0 }, 0);
  });

  // Horizontal work strip
  mm.add("(min-width: 769px)", () => {
    const boxes = $$(".work-box");
    const getDist = () => {
      const left = $(".work-container").getBoundingClientRect().left;
      const box = boxes[0].getBoundingClientRect();
      const parentW = boxes[0].parentElement.getBoundingClientRect().width;
      const pad = parseInt(getComputedStyle(boxes[0]).padding) / 2;
      return box.width * boxes.length - (left + parentW) + pad;
    };
    const tl = gsap.timeline({
      scrollTrigger: { trigger: ".work-section", start: "top top", end: () => `+=${getDist()}`, scrub: 1, pin: true, pinSpacing: true, anticipatePin: 1, id: "work", invalidateOnRefresh: true },
    });
    tl.to(".work-flex", { x: () => -getDist(), ease: "none" });
  });

  // Contact reveal
  gsap.timeline({ scrollTrigger: { trigger: ".contact-section", start: "top 80%", end: "bottom center", toggleActions: "play none none none" } })
    .fromTo(".contact-section h3", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" })
    .fromTo(".contact-box", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.15, ease: "power3.out" }, "-=0.4");
}

/* ==================================================================
   Tech stack animated backdrop (canvas, replaces the video)
   ================================================================== */
(function techBackdrop() {
  const cv = $("#techBg"), g = cv.getContext("2d");
  let w = 0, h = 0, visible = false, t0 = performance.now();
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const stars = [...Array(90)].map(() => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, p: Math.random() * 6.28 }));
  const resize = () => { const r = cv.getBoundingClientRect(); w = r.width; h = r.height; cv.width = w * dpr; cv.height = h * dpr; };
  const blob = (x, y, r, c0, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c0.replace("A", a)); gr.addColorStop(1, c0.replace("A", 0)); g.fillStyle = gr; g.fillRect(0, 0, w, h); };
  function draw(now) {
    if (visible) {
      const t = (now - t0) / 1000;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.fillStyle = "#0a050f"; g.fillRect(0, 0, w, h);
      g.globalCompositeOperation = "lighter";
      blob(w * 0.5, h * 0.5, Math.max(w, h) * 0.55, "rgba(120,60,220,A)", 0.55);
      blob(w * (0.5 + Math.sin(t * 0.21) * 0.18), h * (0.45 + Math.cos(t * 0.17) * 0.12), Math.max(w, h) * 0.32, "rgba(200,90,255,A)", 0.45);
      blob(w * (0.32 + Math.cos(t * 0.13) * 0.1), h * (0.6 + Math.sin(t * 0.19) * 0.1), Math.max(w, h) * 0.28, "rgba(255,120,230,A)", 0.25);
      blob(w * (0.7 + Math.sin(t * 0.11) * 0.1), h * (0.38 + Math.cos(t * 0.23) * 0.1), Math.max(w, h) * 0.26, "rgba(110,80,255,A)", 0.35);
      g.globalCompositeOperation = "source-over";
      g.strokeStyle = "rgba(210,170,255,0.08)"; g.lineWidth = 1;
      for (let k = 0; k < 7; k++) {
        g.beginPath();
        for (let x = 0; x <= w; x += 12) {
          const y = h * (0.25 + k * 0.08) + Math.sin(x / 140 + t * 0.6 + k) * 26 + Math.sin(x / 61 - t * 0.4) * 8;
          x ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
      }
      stars.forEach((s) => {
        g.fillStyle = `rgba(235,220,255,${0.25 + 0.35 * Math.sin(t * 1.5 + s.p) ** 2})`;
        g.beginPath(); g.arc(s.x * w, s.y * h, s.r, 0, 6.283); g.fill();
      });
    }
    requestAnimationFrame(draw);
  }
  new IntersectionObserver((e) => { visible = e[0].isIntersecting; if (visible) resize(); }).observe(cv);
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(draw);
})();

/* ==================================================================
   3D character — an original, procedurally-modelled developer at a desk
   ================================================================== */
async function createCharacter(container, opts = {}) {
  const THREE = await import("three");
  const { RoomEnvironment } = await import("three/addons/environments/RoomEnvironment.js");
  const { RoundedBoxGeometry } = await import("three/addons/geometries/RoundedBoxGeometry.js");

  const rect = container.getBoundingClientRect();
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: window.devicePixelRatio < 2, powerPreference: "high-performance" });
  renderer.setSize(rect.width, rect.height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(14.5, rect.width / rect.height, 0.1, 1000);
  camera.position.set(0, 13.1, 24.7);
  camera.zoom = 1.1;
  camera.updateProjectionMatrix();

  // Lighting: soft studio environment + purple/pink rim lights (all start dark)
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0;
  scene.environmentRotation.set(0.15, -0.6, 0);
  const keyLight = new THREE.DirectionalLight(0xc7a9ff, 0);
  keyLight.position.set(-0.47, -0.32, -1);
  scene.add(keyLight);
  const rimPink = new THREE.DirectionalLight(0xff8ef2, 0);
  rimPink.position.set(3, 3.2, -2.4);
  scene.add(rimPink);
  const rimViolet = new THREE.DirectionalLight(0x9a6bff, 0);
  rimViolet.position.set(-3.2, 1.2, -1.6);
  scene.add(rimViolet);
  const screenLight = new THREE.PointLight(0xc2a4ff, 0, 100, 3);
  screenLight.position.set(3, 12, 4);
  scene.add(screenLight);

  // Materials
  const phys = (o) => new THREE.MeshPhysicalMaterial(o);
  const M = {
    skin: phys({ color: 0xf0ecf2, roughness: 0.42, clearcoat: 0.25, clearcoatRoughness: 0.5, sheen: 0.6, sheenColor: new THREE.Color(0xffb8f2), sheenRoughness: 0.55 }),
    cloth: phys({ color: 0xece8f1, roughness: 0.6, sheen: 1, sheenColor: new THREE.Color(0xd9a6ff), sheenRoughness: 0.45 }),
    pants: phys({ color: 0xd9d4e0, roughness: 0.62, sheen: 0.8, sheenColor: new THREE.Color(0xc89cff), sheenRoughness: 0.5 }),
    hair: phys({ color: 0x100d13, roughness: 0.48, clearcoat: 0.3, clearcoatRoughness: 0.5, sheen: 0.25, sheenColor: new THREE.Color(0x7a55cc), sheenRoughness: 0.5, side: THREE.DoubleSide }),
    dark: phys({ color: 0x1a141f, roughness: 0.55 }),
    lip: phys({ color: 0x3a2833, roughness: 0.5 }),
    eye: phys({ color: 0xf8f6fb, roughness: 0.12, clearcoat: 1 }),
    iris: phys({ color: 0x2b1d5e, roughness: 0.15, clearcoat: 1 }),
    pupil: new THREE.MeshBasicMaterial({ color: 0x07040c }),
    glint: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    frame: phys({ color: 0x2a2233, metalness: 0.6, roughness: 0.28 }),
    lens: new THREE.MeshBasicMaterial({ color: 0xc2a4ff, transparent: true, opacity: 0.08, depthWrite: false }),
    accent: phys({ color: 0xb48cff, roughness: 0.32, clearcoat: 0.6 }),
    pad: phys({ color: 0x241c2e, roughness: 0.7 }),
    furniture: phys({ color: 0xf2eff5, roughness: 0.35, clearcoat: 0.35, clearcoatRoughness: 0.4 }),
    metal: phys({ color: 0xd7d1dd, metalness: 0.55, roughness: 0.28 }),
    keys: phys({ color: 0xcfc9d6, roughness: 0.5 }),
    sole: phys({ color: 0x8f86a0, roughness: 0.6 }),
    monitor: phys({ color: 0xf6eef9, roughness: 0.3, clearcoat: 0.5, transparent: true, opacity: 0, emissive: new THREE.Color(0xff8fc8), emissiveIntensity: 0 }),
  };

  // Geometry helpers
  const UP = new THREE.Vector3(0, 1, 0), FWD = new THREE.Vector3(0, 0, 1);
  const sphere = (r, mat, s = [1, 1, 1], seg = 48) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75)), mat); m.scale.set(...s); return m; };
  const capsule = (r, len, mat) => new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 12, 32), mat);
  const rbox = (w, h, d, r, mat) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), mat);
  const cyl = (rt, rb, h, mat, seg = 32) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  const at = (m, x, y, z) => (m.position.set(x, y, z), m);
  const _v = new THREE.Vector3();
  const between = (m, a, b) => { m.position.addVectors(a, b).multiplyScalar(0.5); _v.subVectors(b, a).normalize(); m.quaternion.setFromUnitVectors(UP, _v); return m; };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);

  const model = new THREE.Group();
  scene.add(model);

  /* ---------- Furniture ---------- */
  const DESK_Y = 8.9, FLOOR_Y = 1.9;
  const desk = new THREE.Group();
  desk.add(at(rbox(8.6, 0.32, 5.0, 0.12, M.furniture), 0.35, DESK_Y - 0.16, 4.6));
  [[-3.7], [4.4]].forEach(([x]) => {
    const legH = DESK_Y - 0.3 - FLOOR_Y;
    [2.6, 6.6].forEach((z) => desk.add(at(rbox(0.22, legH, 0.22, 0.08, M.furniture), x, FLOOR_Y + legH / 2, z)));
    desk.add(at(rbox(0.22, 0.22, 4.3, 0.08, M.furniture), x, FLOOR_Y + 0.11, 4.6));
    desk.add(at(rbox(0.18, 0.18, 4.0, 0.07, M.furniture), x, DESK_Y - 0.5, 4.6));
  });
  // keyboard + keys
  desk.add(at(rbox(3.9, 0.2, 1.35, 0.08, M.furniture), 0, DESK_Y + 0.1, 3.55));
  const keyGeo = new RoundedBoxGeometry(0.2, 0.08, 0.2, 2, 0.03);
  const keys = new THREE.InstancedMesh(keyGeo, M.keys, 4 * 14);
  const km = new THREE.Matrix4();
  let ki = 0;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 14; c++) { km.makeTranslation(-1.66 + c * 0.255, DESK_Y + 0.23, 3.12 + r * 0.29); keys.setMatrixAt(ki++, km); }
  desk.add(keys);
  desk.add(at(sphere(0.3, M.furniture, [0.85, 0.42, 1.3]), 2.75, DESK_Y + 0.12, 3.75));
  // mug
  const mug = at(cyl(0.38, 0.34, 0.95, M.accent), -2.9, DESK_Y + 0.48, 4.7);
  desk.add(mug);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.07, 12, 24), M.accent);
  handle.position.set(-3.3, DESK_Y + 0.5, 4.7); handle.rotation.y = Math.PI / 2;
  desk.add(handle);
  model.add(desk);

  // chair
  const chair = new THREE.Group();
  chair.add(at(rbox(3.5, 0.38, 3.4, 0.17, M.furniture), 0, 6.08, 0.3));
  const back = at(rbox(3.2, 2.7, 0.32, 0.15, M.furniture), 0, 9.0, -1.6);
  back.rotation.x = -0.1;
  chair.add(back);
  [-1.2, 1.2].forEach((x) => chair.add(between(capsule(0.09, 2.2, M.metal), V(x, 6.15, -1.25), V(x, 7.9, -1.56))));
  [[-1.45, -1.2], [1.45, -1.2], [-1.45, 1.75], [1.45, 1.75]].forEach(([x, z]) => {
    const top = V(x, 5.95, z), foot = V(x * 1.1, FLOOR_Y + 0.1, z + Math.sign(z + 0.1) * 0.3);
    chair.add(between(capsule(0.11, top.distanceTo(foot), M.metal), top, foot));
  });
  model.add(chair);

  // monitor (revealed on scroll)
  const monitor = new THREE.Group();
  const screenBody = at(rbox(5.4, 3.3, 0.26, 0.12, M.monitor), 0, 12.0, 6.45);
  monitor.add(screenBody);
  monitor.add(at(rbox(0.4, 1.5, 0.3, 0.08, M.monitor), 0, 9.85, 6.75));
  monitor.add(at(rbox(1.9, 0.12, 1.3, 0.05, M.monitor), 0, DESK_Y + 0.06, 6.6));
  // screen texture (code editor)
  const sc = document.createElement("canvas"); sc.width = 512; sc.height = 320;
  const sg = sc.getContext("2d");
  const grd = sg.createLinearGradient(0, 0, 512, 320); grd.addColorStop(0, "#3a1858"); grd.addColorStop(1, "#160c26");
  sg.fillStyle = grd; sg.fillRect(0, 0, 512, 320);
  sg.fillStyle = "rgba(255,255,255,.08)"; sg.fillRect(0, 0, 512, 20);
  ["#ff6b9a", "#ffd36b", "#6bffb0"].forEach((c, i) => { sg.fillStyle = c; sg.beginPath(); sg.arc(14 + i * 14, 10, 4, 0, 6.28); sg.fill(); });
  const cols = ["#c2a4ff", "#ff8fd0", "#8fd8ff", "#f4ecff", "#a7ffcf"];
  let seed = 3; const rr = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  for (let y = 38, ind = 0; y < 310; y += 16) {
    ind = Math.max(0, Math.min(4, ind + (rr() < 0.3 ? 1 : rr() < 0.3 ? -1 : 0)));
    let x = 26 + ind * 22;
    sg.fillStyle = "rgba(255,255,255,.18)"; sg.fillRect(6, y, 10, 6);
    const n = 1 + Math.floor(rr() * 4);
    for (let k = 0; k < n; k++) { const len = 20 + rr() * 90; sg.fillStyle = cols[Math.floor(rr() * cols.length)]; sg.fillRect(x, y, len, 7); x += len + 10; if (x > 480) break; }
  }
  const screenTex = new THREE.CanvasTexture(sc); screenTex.colorSpace = THREE.SRGBColorSpace;
  const screenMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: screenTex, emissiveIntensity: 1, transparent: true, opacity: 0, roughness: 0.4 });
  const screen = at(new THREE.Mesh(new THREE.PlaneGeometry(5.05, 2.95), screenMat), 0, 12.0, 6.45 - 0.135);
  screen.rotation.y = Math.PI;
  monitor.add(screen);
  monitor.position.set(0, -10, 2);
  model.add(monitor);

  /* ---------- Character ---------- */
  const HIP_Y = 7.2;
  const hips = at(new THREE.Group(), 0, HIP_Y, 0);
  model.add(hips);
  hips.add(at(sphere(1, M.pants, [1.55, 0.95, 1.25]), 0, 0.05, 0.1));
  // legs
  [-1, 1].forEach((s) => {
    const hip = V(s * 0.85, 0, 0.3), knee = V(s * 0.95, -0.05, 3.45), ankle = V(s * 0.98, -(HIP_Y - FLOOR_Y - 0.7), 3.7);
    hips.add(between(capsule(0.74, hip.distanceTo(knee), M.pants), hip, knee));
    hips.add(at(sphere(0.74, M.pants), knee.x, knee.y, knee.z));
    hips.add(between(capsule(0.62, knee.distanceTo(ankle), M.pants), knee, ankle));
    hips.add(at(cyl(0.64, 0.66, 0.3, M.cloth), ankle.x, ankle.y + 0.15, ankle.z));
    hips.add(at(sphere(0.62, M.furniture, [1.0, 0.62, 1.55]), ankle.x, -(HIP_Y - FLOOR_Y - 0.45), 4.05));
    hips.add(at(rbox(1.25, 0.2, 2.0, 0.09, M.sole), ankle.x, -(HIP_Y - FLOOR_Y - 0.12), 4.05));
  });

  // spine (leans toward the desk on scroll)
  const spine = new THREE.Group();
  hips.add(spine);
  const prof = [[0, -0.3], [1.0, -0.28], [1.42, -0.05], [1.55, 0.5], [1.56, 1.4], [1.62, 2.2], [1.74, 2.9], [1.78, 3.3], [1.62, 3.78], [1.22, 4.12], [0.72, 4.33], [0, 4.42]].map(([r, y]) => new THREE.Vector2(r, y));
  const torso = new THREE.Mesh(new THREE.LatheGeometry(prof, 64), M.cloth);
  torso.scale.set(1.2, 1, 0.78);
  spine.add(torso);
  [-1, 1].forEach((s) => spine.add(at(sphere(0.8, M.cloth, [1, 0.85, 0.95]), s * 1.86, 3.5, 0)));
  // hood rolled behind the neck + ribbed neckline
  const hood = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.36, 18, 48, Math.PI * 1.25), M.cloth);
  hood.rotation.set(Math.PI / 2, 0, -Math.PI * 0.125 + Math.PI);
  hood.position.set(0, 4.18, -0.14); hood.scale.set(1.08, 1, 1);
  spine.add(hood);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.12, 14, 40), M.cloth);
  collar.rotation.x = Math.PI / 2 - 0.15; collar.position.set(0, 4.3, 0.05);
  spine.add(collar);
  // drawstrings
  [-1, 1].forEach((s) => {
    const a = V(s * 0.32, 4.15, 0.95), b = V(s * 0.36, 2.85, 1.5);
    spine.add(between(capsule(0.045, a.distanceTo(b), M.cloth), a, b));
    spine.add(between(cyl(0.06, 0.06, 0.22, M.accent, 12), V(b.x, b.y + 0.02, b.z), V(b.x, b.y - 0.2, b.z + 0.02)));
  });
  // kangaroo pocket
  const pocket = at(rbox(2.3, 1.05, 0.14, 0.06, M.cloth), 0, 1.25, 1.22);
  pocket.rotation.x = -0.06;
  spine.add(pocket);

  // neck + headphones resting on the collar
  spine.add(at(cyl(0.5, 0.56, 0.8, M.skin), 0, 4.48, 0.02));
  const band = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.1, 12, 48, Math.PI * 1.2), M.accent);
  band.rotation.set(Math.PI / 2 + 0.32, 0, Math.PI - Math.PI * 0.1);
  band.position.set(0, 4.4, -0.08);
  spine.add(band);
  [-1, 1].forEach((s) => {
    const cup = new THREE.Group();
    cup.add(cyl(0.42, 0.42, 0.28, M.accent));
    const pad = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.12, 12, 28), M.pad);
    pad.rotation.x = Math.PI / 2; pad.position.y = 0.17;
    cup.add(pad);
    cup.position.set(s * 0.98, 4.18, 0.62);
    cup.quaternion.setFromUnitVectors(UP, V(-s * 0.55, 0.62, 0.55).normalize());
    spine.add(cup);
  });

  // head
  const head = at(new THREE.Group(), 0, 4.62, 0.05);
  spine.add(head);
  const face = at(new THREE.Group(), 0, 1.32, 0);
  head.add(face);
  face.add(at(sphere(1, M.skin, [1.13, 1.22, 1.12], 64), 0, 0.1, 0));
  face.add(at(sphere(1, M.skin, [1.0, 0.86, 1.0], 64), 0, -0.42, 0.08));
  [-1, 1].forEach((s) => {
    const ear = at(sphere(0.3, M.skin, [0.62, 1.2, 0.42]), s * 1.12, -0.05, -0.02);
    ear.rotation.y = s * 0.35;
    face.add(ear);
    const inner = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.045, 10, 24), M.skin);
    inner.position.set(s * 1.2, -0.05, 0.04); inner.rotation.y = s * 1.2; inner.scale.set(1, 1.5, 1);
    face.add(inner);
  });
  // eyes with lids (for blinking)
  const lids = [], brows = [];
  [-1, 1].forEach((s) => {
    const eyeG = at(new THREE.Group(), s * 0.42, 0.04, 0.97);
    eyeG.scale.set(1, 1.05, 0.58);
    eyeG.add(sphere(0.27, M.eye, [1, 1, 1], 32));
    eyeG.add(at(sphere(0.155, M.iris, [1, 1, 0.45], 32), 0, -0.02, 0.235));
    eyeG.add(at(sphere(0.075, M.pupil, [1, 1, 0.4], 16), 0, -0.02, 0.292));
    eyeG.add(at(sphere(0.035, M.glint, [1, 1, 0.5], 12), 0.055, 0.04, 0.31));
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.29, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.skin);
    lid.rotation.x = -0.5;
    eyeG.add(lid);
    lids.push(lid);
    face.add(eyeG);
    const brow = capsule(0.075, 0.4, M.hair);
    brow.rotation.set(0, s * 0.3, Math.PI / 2 + s * 0.08);
    brow.position.set(s * 0.45, 0.45, 1.03);
    brow.userData.baseY = 0.45;
    face.add(brow);
    brows.push(brow);
  });
  face.add(at(sphere(0.16, M.skin, [1, 1.12, 1]), 0, -0.24, 1.1));
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.21, 0.034, 10, 32, Math.PI * 0.72), M.lip);
  mouth.rotation.z = -Math.PI * 0.86 + 0.12;
  mouth.position.set(0.06, -0.52, 1.0);
  mouth.rotation.x = -0.2;
  face.add(mouth);
  // glasses
  const glasses = new THREE.Group();
  [-1, 1].forEach((s) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.045, 12, 48), M.frame);
    ring.position.set(s * 0.43, 0.04, 1.17);
    ring.rotation.y = s * 0.12;
    glasses.add(ring);
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.31, 40), M.lens);
    lens.position.copy(ring.position); lens.rotation.y = s * 0.12;
    glasses.add(lens);
    glasses.add(between(capsule(0.035, 1.0, M.frame), V(s * 0.76, 0.1, 1.08), V(s * 1.13, 0.1, 0.05)));
  });
  glasses.add(between(capsule(0.035, 0.12, M.frame), V(-0.11, 0.1, 1.22), V(0.11, 0.1, 1.22)));
  face.add(glasses);
  // hair: cap + top volume + side-swept fringe
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 32, 0, Math.PI * 2, 0, Math.PI * 0.55), M.hair);
  cap.scale.set(1.18, 1.3, 1.19); cap.position.set(0, 0.18, -0.1); cap.rotation.x = -0.52;
  face.add(cap);
  [
    [0.04, 1.08, 0.1, 1, [1.16, 0.56, 1.08], [0.12, 0, -0.06]],
    [0.26, 0.98, 0.72, 1, [0.98, 0.32, 0.56], [0.5, 0.28, -0.3]],
    [-0.46, 1.0, 0.64, 1, [0.66, 0.3, 0.5], [0.52, -0.3, 0.26]],
    [0.0, 0.62, -0.72, 1, [1.12, 0.92, 0.62], [-0.2, 0, 0]],
  ].forEach(([x, y, z, r, s, rot]) => { const h = at(sphere(r, M.hair, s, 48), x, y, z); h.rotation.set(...rot); face.add(h); });
  [-1, 1].forEach((s) => { const sb = at(sphere(0.3, M.hair, [0.5, 1.2, 1.15], 24), s * 1.07, 0.38, 0.12); face.add(sb); });

  // arms (solved with 2-bone IK every frame so the hands stay on the keyboard)
  const L1 = 2.5, L2 = 2.3;
  const arms = [-1, 1].map((s) => {
    const parts = {
      upper: capsule(0.52, L1, M.cloth), elbow: sphere(0.5, M.cloth), fore: capsule(0.45, L2, M.cloth),
      cuff: new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.12, 12, 28), M.cloth), hand: sphere(0.42, M.skin, [1.05, 0.62, 1.35], 32),
      thumb: capsule(0.12, 0.25, M.skin),
    };
    Object.values(parts).forEach((m) => spine.add(m));
    return { s, parts, shoulder: V(s * 2.0, 3.55, 0.05), target: new THREE.Vector3(), phase: s > 0 ? 0 : Math.PI * 0.8 };
  });
  const _d = new THREE.Vector3(), _perp = new THREE.Vector3(), _E = new THREE.Vector3(), _T = new THREE.Vector3(), _pole = new THREE.Vector3(), _w = new THREE.Vector3();
  function solveArm(arm, t) {
    const { s, parts, shoulder } = arm;
    const tap = Math.max(0, Math.sin(t * 13 + arm.phase)) * 0.12 + Math.max(0, Math.sin(t * 7.3 + arm.phase * 2)) * 0.05;
    _w.set(s * 0.78 + Math.sin(t * 2.1 + arm.phase) * 0.12, DESK_Y + 0.5 + tap, 3.05);
    model.localToWorld(_w);
    spine.worldToLocal(_T.copy(_w));
    _d.subVectors(_T, shoulder);
    let dist = _d.length(); _d.normalize();
    dist = Math.min(Math.max(dist, Math.abs(L1 - L2) + 0.01), L1 + L2 - 0.01);
    _T.copy(shoulder).addScaledVector(_d, dist);
    const a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist);
    const h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    _pole.set(s * 1.7, -2.4, -1.4).add(shoulder).sub(shoulder);
    _perp.copy(_pole).addScaledVector(_d, -_pole.dot(_d)).normalize();
    _E.copy(shoulder).addScaledVector(_d, a).addScaledVector(_perp, h);
    between(parts.upper, shoulder, _E);
    parts.elbow.position.copy(_E);
    between(parts.fore, _E, _T);
    const fdir = _v.subVectors(_T, _E).normalize().clone();
    parts.cuff.position.copy(_T).addScaledVector(fdir, -0.15);
    parts.cuff.quaternion.setFromUnitVectors(FWD, fdir);
    parts.hand.position.copy(_T).addScaledVector(fdir, 0.42);
    parts.hand.quaternion.setFromUnitVectors(FWD, fdir);
    parts.thumb.position.copy(parts.hand.position).add(_v.set(-s * 0.38, 0.05, -0.05));
    parts.thumb.quaternion.setFromUnitVectors(UP, fdir);
  }

  /* ---------- State & animation ---------- */
  const pose = { spine: 0, introPitch: 0 };
  const mouse = { x: 0, y: 0 }, lerpK = { x: 0.1, y: 0.2 };
  const look = { yaw: 0, pitch: 0 };
  const onMove = (e) => { mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = (-e.clientY / window.innerHeight) * 2 + 1; };
  document.addEventListener("mousemove", onMove);
  const landing = document.getElementById("landingDiv");
  landing.addEventListener("touchmove", (e) => { const t = e.touches[0]; onMove({ clientX: t.clientX, clientY: t.clientY }); }, { passive: true });
  landing.addEventListener("touchend", () => { setTimeout(() => { mouse.x = 0; mouse.y = 0; lerpK.x = 0.03; lerpK.y = 0.03; setTimeout(() => { lerpK.x = 0.1; lerpK.y = 0.2; }, 1000); }, 2000); });

  // eyebrow raise when hovering the character
  let browUp = 0, browTarget = 0;
  if (opts.hoverEl) {
    opts.hoverEl.addEventListener("mouseenter", () => (browTarget = 1));
    opts.hoverEl.addEventListener("mouseleave", () => (browTarget = 0));
  }

  // blinking
  let blinkT = -1, nextBlink = 2.5, blinkOn = false;
  // screen flicker
  let flick = 0;
  setInterval(() => (flick = Math.random()), 200);
  gsap.timeline({ repeat: -1, repeatRefresh: true }).to(screenMat, { emissiveIntensity: () => 0.75 + 0.9 * flick, duration: () => 0.6 * Math.random() + 0.05, delay: () => 0.1 * Math.random() });

  const clock = new THREE.Clock();
  let running = true;
  const lerp = THREE.MathUtils.lerp;
  function frame() {
    if (!running) return;
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

    // head tracking (eases toward the cursor near the top, toward the screen once scrolled)
    const desktop = window.innerWidth > 1024;
    if (window.scrollY < 200 || !desktop || opts.static) {
      const r = Math.PI / 6;
      const yawT = mouse.x * r;
      const pitchT = THREE.MathUtils.clamp(-mouse.y * 0.42, -0.42, 0.3) + 0.04;
      look.yaw = lerp(look.yaw, yawT, lerpK.y);
      look.pitch = lerp(look.pitch, pitchT, lerpK.x);
    } else {
      look.yaw = lerp(look.yaw, -0.08, 0.03);
      look.pitch = lerp(look.pitch, 0.32 - pose.spine * 0.7, 0.03);
    }
    head.rotation.set(look.pitch + pose.introPitch + Math.sin(t * 1.3) * 0.012, look.yaw, Math.sin(t * 0.7) * 0.015);
    spine.rotation.x = pose.spine * 0.55 + Math.sin(t * 1.6) * 0.008;
    torso.scale.x = 1.2 + Math.sin(t * 1.6) * 0.006;

    // blink
    if (blinkOn) {
      if (blinkT < 0 && t > nextBlink) blinkT = 0;
      if (blinkT >= 0) {
        blinkT += dt;
        const k = blinkT < 0.08 ? blinkT / 0.08 : Math.max(0, 1 - (blinkT - 0.08) / 0.1);
        lids.forEach((l) => (l.rotation.x = lerp(-0.35, 1.45, k)));
        if (blinkT > 0.18) { blinkT = -1; nextBlink = t + 2 + Math.random() * 3.5; }
      }
    }
    browUp = lerp(browUp, browTarget, 0.12);
    brows.forEach((b) => (b.position.y = b.userData.baseY + browUp * 0.11));

    // hands on keyboard
    model.updateMatrixWorld(true);
    arms.forEach((a) => solveArm(a, t));

    // screen light follows screen brightness once visible
    screenLight.intensity = screenMat.opacity > 0.9 ? 60 * screenMat.emissiveIntensity : 0;
    M.monitor.emissiveIntensity = screenMat.opacity * 0.3 * screenMat.emissiveIntensity;

    renderer.render(scene, camera);
  }

  function resize() {
    const r = container.getBoundingClientRect();
    if (!r.width || !r.height) return;
    renderer.setSize(r.width, r.height);
    camera.aspect = r.width / r.height;
    camera.updateProjectionMatrix();
  }

  return {
    THREE, renderer, scene, camera, model, pose, monitor, monitorMat: M.monitor, screenMat,
    start() { clock.start(); frame(); },
    resize,
    turnOnLights(instant) {
      const ease = "power2.inOut", d = instant ? 0 : 2;
      gsap.to(scene, { environmentIntensity: 0.46, duration: d, ease });
      gsap.to(keyLight, { intensity: 1, duration: d, ease });
      gsap.to(rimPink, { intensity: 3.2, duration: d, ease });
      gsap.to(rimViolet, { intensity: 2.4, duration: d, ease });
    },
    startIntro() {
      gsap.fromTo(pose, { introPitch: 0.55 }, { introPitch: 0, duration: 2, ease: "power3.out" });
      gsap.fromTo(model.position, { y: -0.6 }, { y: 0, duration: 2, ease: "power3.out" });
      setTimeout(() => (blinkOn = true), 2500);
    },
    dispose() { running = false; renderer.dispose(); renderer.domElement.remove(); document.removeEventListener("mousemove", onMove); },
  };
}

/* Scroll choreography for the 3D character (desktop) */
function characterScroll(api) {
  gsap.matchMedia().add("(min-width: 1025px)", () => characterTimelines(api));
}
function characterTimelines(api) {
  const { model, camera, pose, monitor, monitorMat, screenMat } = api;
  const landing = gsap.timeline({ scrollTrigger: { trigger: ".landing-section", start: "top top", end: "bottom top", scrub: true, invalidateOnRefresh: true } });
  const about = gsap.timeline({ scrollTrigger: { trigger: ".about-section", start: "center 55%", end: "bottom top", scrub: true, invalidateOnRefresh: true } });
  const what = gsap.timeline({ scrollTrigger: { trigger: ".whatIDO", start: "top top", end: "bottom top", scrub: true, invalidateOnRefresh: true } });

  landing
    .fromTo(model.rotation, { y: 0 }, { y: 0.7, duration: 1 }, 0)
    .to(camera.position, { z: 22 }, 0)
    .fromTo(".character-model", { x: 0 }, { x: "-25%", duration: 1 }, 0)
    .to(".landing-container", { opacity: 0, duration: 0.4 }, 0)
    .to(".landing-container", { y: "40%", duration: 0.8 }, 0)
    .fromTo(".about-me", { y: "-50%" }, { y: "0%" }, 0);

  about
    .to(camera.position, { z: 75, y: 8.4, duration: 6, delay: 2, ease: "power3.inOut" }, 0)
    .to(".about-section", { y: "30%", duration: 6 }, 0)
    .to(".about-section", { opacity: 0, delay: 3, duration: 2 }, 0)
    .fromTo(".character-model", { pointerEvents: "inherit" }, { pointerEvents: "none", x: "-12%", delay: 2, duration: 5 }, 0)
    .to(model.rotation, { y: 0.92, x: 0.12, delay: 3, duration: 3 }, 0)
    .to(pose, { spine: 0.6, delay: 2, duration: 3 }, 0)
    .to(monitorMat, { opacity: 1, duration: 0.8, delay: 3.2 }, 0)
    .to(screenMat, { opacity: 1, duration: 0.8, delay: 4.5 }, 0)
    .fromTo(".what-box-in", { display: "none" }, { display: "flex", duration: 0.1, delay: 6 }, 0)
    .fromTo(monitor.position, { y: -10, z: 2 }, { y: 0, z: 0, delay: 1.5, duration: 3 }, 0)
    .fromTo(".character-rim", { opacity: 1, scaleX: 1.4 }, { opacity: 0, scale: 0, y: "-70%", duration: 5, delay: 2 }, 0.3);

  what
    .fromTo(".character-model", { y: "0%" }, { y: "-100%", duration: 4, ease: "none", delay: 1 }, 0)
    .fromTo(".whatIDO", { y: 0 }, { y: "15%", duration: 2 }, 0)
    .to(model.rotation, { x: -0.04, duration: 2, delay: 1 }, 0);
}

/* ==================================================================
   Boot
   ================================================================== */
const progressEl = $("#loadingPercent");
const progress = createProgress((n) => (progressEl.textContent = `${n}%`));
const minLoader = new Promise((r) => setTimeout(r, 3000));
const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();

if (MODE === "mobile") {
  $("#loader").remove();
  setTimeout(initialFX, 100);
}
setupSectionAnimations();

(async () => {
  let api = null;
  try {
    if (MODE === "desktop" || MODE === "tablet") {
      api = await createCharacter($(".character-model"), { hoverEl: $(".character-hover") });
    } else if (MODE === "mobile") {
      api = await createCharacter($(".mobile-photo .mobile-stage"), { static: true });
      api.camera.position.set(0, 12.35, 31);
      api.camera.updateProjectionMatrix();
    }
  } catch (err) {
    console.warn("3D character unavailable:", err);
    api = null;
  }
  if (api) {
    api.start();
    window.addEventListener("resize", api.resize);
  }
  if (MODE === "mobile") {
    if (api) { api.turnOnLights(); api.startIntro(); }
    return;
  }
  await Promise.all([minLoader, fontsReady]);
  if (api) {
    characterScroll(api);
    ScrollTrigger.sort();
    ScrollTrigger.refresh();
  }
  await progress.loaded();
  finishLoader();
  if (api) setTimeout(() => { api.turnOnLights(); api.startIntro(); }, 2500);
})();
</script>
